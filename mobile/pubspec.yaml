name: dalili
description: "Dalili - your AI travel planner (iOS + Android): the Dalili website in a native shell."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0          # the website: one UI for the web and the app
  webview_flutter_android: ^4.3.0   # the file chooser (the landmark camera's photo) on Android
  image_picker: ^1.1.2              # the camera or the gallery for that photo
  url_launcher: any                 # links out of the site open in the browser
  shared_preferences: any           # the previous app's guest id, open trip, language and theme (carried over once)
  flutter_secure_storage: any       # the previous app's sign-in token (carried over once)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: any   # generates the app icon for Android and iOS

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#04060C"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
