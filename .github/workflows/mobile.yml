# The mobile app.
#
# - Push to main with changes in mobile/lib -> Shorebird PATCH: the new Dart code reaches installed apps over the air
#   on their next launch. No store upload, no review.
# - Manual run with "release" -> a new STORE build (needed only for native changes: permissions, new plugins,
#   Flutter upgrades, app icon): an .aab for Google Play and an .ipa uploaded to App Store Connect / TestFlight.
#
# Secrets: SHOREBIRD_TOKEN, ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD,
#          APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY, IOS_DIST_CERT_P12_BASE64,
#          IOS_DIST_CERT_PASSWORD, IOS_PROFILE_BASE64
# Variables: DALILI_SERVER (https URL of the backend)
name: Mobile

on:
  push:
    branches: [main]
    paths: ["mobile/lib/**", "mobile/assets/**"]
  workflow_dispatch:
    inputs:
      kind:
        description: "patch = over-the-air update, release = new store build"
        required: true
        default: patch
        type: choice
        options: [patch, release]

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Signing key
        run: |
          # Secrets saved from Windows may carry \r: strip whitespace before decoding.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          PW=$(echo "${{ secrets.ANDROID_KEY_PASSWORD }}" | tr -d '\r\n')
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' "$PW" "$PW" > android/key.properties
      - name: Patch (over the air)
        if: github.event_name == 'push' || inputs.kind == 'patch'
        run: shorebird patch android --release-version latest -- --dart-define=DALILI_SERVER=${{ vars.DALILI_SERVER }}
      - name: Release (store build)
        if: github.event_name == 'workflow_dispatch' && inputs.kind == 'release'
        run: shorebird release android -- --dart-define=DALILI_SERVER=${{ vars.DALILI_SERVER }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.kind == 'release'
        with:
          name: android-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  ios:
    # Off until the Apple Developer account and signing secrets exist (repository variable IOS_ENABLED=true).
    if: vars.IOS_ENABLED == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN" && security set-keychain-settings "$KEYCHAIN" && security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" && security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/dalili.mobileprovision
      - name: Patch (over the air)
        if: github.event_name == 'push' || inputs.kind == 'patch'
        run: shorebird patch ios --release-version latest -- --dart-define=DALILI_SERVER=${{ vars.DALILI_SERVER }}
      - name: Release (store build) and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.kind == 'release'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          shorebird release ios -- --dart-define=DALILI_SERVER=${{ vars.DALILI_SERVER }}
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
