# Every push to main (outside mobile/) that passes the tests goes live: build the image, push it to the Azure
# Container Registry, roll the Container App to it. Zero downtime (a new revision takes traffic once healthy).
#
# Repository settings -> Secrets and variables -> Actions:
#   secret   AZURE_CREDENTIALS   service principal JSON (az ad sp create-for-rbac ... --json-auth)
#   variable AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP, AZURE_ACR_NAME
name: Deploy backend

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push the image (in Azure, no Docker needed here)
        run: |
          az acr build --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "dalili:${{ github.sha }}" --image "dalili:latest" .
      - name: Roll out
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/dalili:${{ github.sha }}"
      - name: Wait until the new revision serves the traffic
        run: |
          for i in $(seq 1 40); do
            read latest ready <<< $(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n' ' ')
            [ -n "$latest" ] && [ "$latest" = "$ready" ] && { echo "serving $latest"; sleep 15; exit 0; }
            sleep 10
          done
          echo "The new revision never became ready" && exit 1
      - name: Smoke test
        run: |
          url=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            curl -fsS "https://$url/api/health" && exit 0
            sleep 10
          done
          echo "The new revision did not become healthy" && exit 1
      - name: Tell search engines about new and updated pages (IndexNow)
        if: vars.INDEXNOW_KEY != ''
        run: |
          url=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query properties.configuration.ingress.fqdn -o tsv)
          urls=$(curl -fsS "https://$url/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          jq -n --arg host "$url" --arg key "${{ vars.INDEXNOW_KEY }}" --arg loc "https://$url/indexnow.txt" \
                --argjson urls "$urls" '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}' \
            | curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
                -H "Content-Type: application/json; charset=utf-8" --data @-
