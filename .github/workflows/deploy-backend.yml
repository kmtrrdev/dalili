# Every push to main (outside mobile/) that passes the tests goes live: build the image, push it to the Azure
# Container Registry, roll the Container App to it. Zero downtime (a new revision takes traffic once healthy).
#
# Repository settings -> Secrets and variables -> Actions:
#   secret   AZURE_CREDENTIALS   service principal JSON (az ad sp create-for-rbac ... --json-auth)
#   variable AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP, AZURE_ACR_NAME
name: Deploy backend

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push the image (in Azure, no Docker needed here)
        run: |
          az acr build --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "dalili:${{ github.sha }}" --image "dalili:latest" .
      - name: Roll out
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/dalili:${{ github.sha }}"
      - name: Smoke test
        run: |
          url=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            curl -fsS "https://$url/api/health" && exit 0
            sleep 10
          done
          echo "The new revision did not become healthy" && exit 1
